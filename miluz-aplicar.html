<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" id="theme-color" content="#F7F6F4">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sumate como creadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* escala neutra compartida; el acento, el degradé y el fondo los pone
     la marca (estilo en la config del backend) al cargar */
  --bg:#F7F6F4; --bg2:#F4EDE4; --sup:#FFFFFF; --sup2:#F6EFE6;
  --linea:#EBE0D2; --linea2:#DFD1BE;
  --tx:#2A231D; --tx2:#6B5E51; --tx3:#9C8D7C;
  --rosa:#7A7A7A; --ok:#4F8C63; --no:#C0524C;
  --grad:linear-gradient(135deg,#9A9A9A 0%,#7A7A7A 48%,#5E5E5E 100%);
  --tinte1:rgba(0,0,0,0); --tinte2:rgba(0,0,0,0);
  --acento-rgb:122,122,122;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:Manrope,-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(880px 400px at 10% -10%, var(--tinte1), transparent 62%),
    radial-gradient(720px 360px at 95% 2%, var(--tinte2), transparent 60%);
  background-attachment:fixed;
  display:flex;flex-direction:column;min-height:100dvh;
}

/* ── progreso ── */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(12px)}
.barra{height:3px;background:var(--linea)}
.barra i{display:block;height:100%;background:var(--grad);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.top .fila{
  max-width:520px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:12px
}
.top .marca{font-weight:800;font-size:1.25rem;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.logo-grande .top .marca{font-size:1.55rem}
.op.off{opacity:.45;cursor:default;background:var(--sup2)}
.op.off .et{text-decoration:line-through}
.op .cupo{flex:0 0 auto;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--no);background:var(--sup);border:1px solid var(--linea);border-radius:99px;padding:3px 8px}
.kits{display:flex;flex-direction:column;gap:10px}
.kits .op .sw{flex:0 0 30px;height:30px;border-radius:9px}
.top .cuenta{margin-left:auto;font-size:.78rem;color:var(--tx3);font-variant-numeric:tabular-nums}
.volver{
  border:0;background:none;padding:6px;margin:-6px 0 -6px -6px;cursor:pointer;
  color:var(--tx3);display:grid;place-items:center;border-radius:8px
}
.volver:hover{background:var(--bg2);color:var(--tx)}
.volver svg{width:20px;height:20px;display:block}
.volver[hidden]{visibility:hidden}

/* ── pantalla ── */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 40px}
.paso{width:100%;max-width:520px;display:none;animation:entra .32s cubic-bezier(.2,.8,.3,1)}
.paso.on{display:block}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .paso{animation:none}
  .barra i{transition:none}
}

.pregunta{font-size:clamp(1.5rem,5.5vw,2rem);font-weight:800;line-height:1.16;margin:0 0 10px;letter-spacing:-.03em;text-wrap:balance}
.ayuda{margin:0 0 24px;color:var(--tx2);font-size:.98rem;line-height:1.55}
.ayuda b{color:var(--tx);font-weight:700}

/* ── campos ── */
.campo{
  width:100%;padding:17px 18px;font:inherit;font-size:17px;color:var(--tx);
  background:var(--sup);border:1.5px solid var(--linea);border-radius:15px;outline:none
}
.campo::placeholder{color:var(--tx3)}
.campo:focus{border-color:var(--rosa);box-shadow:0 0 0 4px rgba(var(--acento-rgb),.13)}
.conArroba{position:relative}
.conArroba span{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:17px;pointer-events:none}
.conArroba .campo{padding-left:36px}

/* ── opciones ── */
.ops{display:flex;flex-direction:column;gap:10px}
.op{
  display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;
  background:var(--sup);border:1.5px solid var(--linea);border-radius:15px;
  transition:border-color .12s,background .12s
}
.op:hover{border-color:var(--linea2)}
.op input{position:absolute;opacity:0;pointer-events:none}
.op .tec{
  flex:0 0 30px;height:30px;border-radius:9px;background:var(--bg2);color:var(--tx3);
  display:grid;place-items:center;font-size:.82rem;font-weight:700
}
.op .et{flex:1;font-size:1rem;font-weight:600}
.op .et small{display:block;font-weight:400;font-size:.85rem;color:var(--tx3);margin-top:2px}
.op:has(input:checked){border-color:var(--rosa);background:color-mix(in srgb, var(--rosa) 6%, var(--sup))}
.op:has(input:checked) .tec{background:var(--grad);color:#fff}

/* ── fotos ── */
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{
  position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;
  border:1.5px dashed var(--linea2);background:var(--sup);
  display:grid;place-items:center;cursor:pointer;text-align:center;padding:14px
}
.slot:hover{border-color:var(--rosa)}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .ph{display:grid;gap:8px;justify-items:center;color:var(--tx3);pointer-events:none}
.slot .ph svg{width:26px;height:26px}
.slot .ph b{font-size:.85rem;font-weight:700;color:var(--tx2)}
.slot .ph small{font-size:.75rem;line-height:1.35}
.slot.lleno{border-style:solid;border-color:var(--ok)}
.slot .quitar{
  position:absolute;right:8px;top:8px;z-index:2;width:30px;height:30px;border:0;border-radius:9px;
  background:rgba(42,35,29,.7);color:#fff;cursor:pointer;display:none;place-items:center;font-size:1rem
}
.slot.lleno .quitar{display:grid}
.tip{
  margin-top:14px;padding:13px 15px;border-radius:13px;background:var(--bg2);
  border:1px solid var(--linea);font-size:.85rem;color:var(--tx2);line-height:1.5
}
.tip b{color:var(--tx)}

/* ── opciones a elegir (colores) ── */
.tonos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tono{cursor:pointer;text-align:center}
.tono input{display:none}
.tono .sw{aspect-ratio:1;border-radius:50%;border:2px solid var(--linea);display:block;position:relative;transition:transform .13s}
.tono .sw.txt{display:grid;place-items:center;background:var(--bg2);font-weight:800;color:var(--tx2);font-size:.95rem}
.tono input:checked+.sw{border-color:var(--rosa);transform:scale(1.09);box-shadow:0 0 0 3px rgba(var(--acento-rgb),.2)}
.tono input:checked+.sw::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.tono .nm{font-size:.68rem;color:var(--tx3);margin-top:6px;display:block;line-height:1.2}
.tono.off{opacity:.28;pointer-events:none}

/* ── botones ── */
.btn{
  display:block;width:100%;margin-top:22px;padding:17px;border:0;border-radius:15px;
  background:var(--grad);color:#fff;font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;
  box-shadow:0 10px 22px -10px rgba(var(--acento-rgb),.55)
}
.btn:disabled{background:var(--sup2);color:var(--tx3);box-shadow:none;cursor:default}
.err{color:var(--no);font-size:.85rem;margin-top:10px;display:none}
.err.ver{display:block}

/* ── portada y cierre ── */
.centro{text-align:center}
.hero-t{font-size:clamp(2rem,7vw,2.7rem);font-weight:800;line-height:1.05;letter-spacing:-.035em;margin:0 0 14px;text-wrap:balance}
.reqs{display:flex;flex-direction:column;gap:9px;margin:24px 0 0;text-align:left}
.req{display:flex;gap:11px;align-items:flex-start;font-size:.95rem;color:var(--tx2)}
.req svg{flex:0 0 19px;width:19px;height:19px;color:var(--ok);margin-top:2px}
.sello{
  width:74px;height:74px;border-radius:50%;background:var(--grad);color:#fff;
  display:grid;place-items:center;margin:0 auto 20px
}
.sello svg{width:34px;height:34px}
.chip{
  display:inline-block;padding:7px 15px;border-radius:99px;background:var(--bg2);
  border:1px solid var(--linea);font-size:.82rem;font-weight:700;color:var(--tx2);margin-bottom:18px
}
.spinner{
  width:26px;height:26px;border:2.5px solid var(--sup2);border-top-color:var(--rosa);
  border-radius:50%;animation:g .7s linear infinite;margin:70px auto
}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <div class="barra"><i id="barra"></i></div>
  <div class="fila">
    <button class="volver" id="volver" hidden aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="marca" id="marca-nombre"></span>
    <span class="cuenta" id="cuenta"></span>
  </div>
</div>

<main id="main"><div class="spinner"></div></main>

<script>
/* ═══════════════════════════════════════════════════════════════
   Aplicación de creadoras · multi-marca
   Una pregunta por pantalla. El @usuario va PRIMERO a propósito:
   apenas lo tenemos, se dispara la verificación por atrás mientras
   ella sigue completando, así no hay ninguna espera al final.

   TODO lo de la marca (nombre, kit, preguntas, opciones, colores)
   viene de la acción `config` del backend según ?marca= (default
   miluz, para no romper los links que ya circulan).
   ═══════════════════════════════════════════════════════════════ */

const API = 'https://us-central1-cleargy-creators.cloudfunctions.net/canje';
const QS = new URLSearchParams(location.search);
const MARCA = (QS.get('marca') || 'miluz').toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'miluz';
let CFG = null;   // la config pública de la marca

/* ── config de la marca: cacheada por marca en sessionStorage ── */
async function cargarConfig(){
  const k = 'canje_cfg_' + MARCA;
  try {
    const c = JSON.parse(sessionStorage.getItem(k) || 'null');
    if (c && c.cfg && Date.now() - c.t < 10 * 60e3) return c.cfg;
  } catch {}
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ accion:'config', marca:MARCA }) });
  const d = await r.json();
  if (!d || !d.ok) throw new Error('config');
  try { sessionStorage.setItem(k, JSON.stringify({ t: Date.now(), cfg: d.marca })); } catch {}
  return d.marca;
}

/* ── estilo de la marca → variables CSS ── */
function rgbDe(hex){
  const m = /^#?([\da-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function aplicarEstilo(e){
  if (!e) return;
  const r = document.documentElement.style;
  const g = e.gradiente && e.gradiente.length ? e.gradiente : [e.acento, e.acento];
  if (e.fondo){ r.setProperty('--bg', e.fondo); document.getElementById('theme-color').setAttribute('content', e.fondo); }
  if (e.acento){ r.setProperty('--rosa', e.acento); const c = rgbDe(e.acento); if (c) r.setProperty('--acento-rgb', c.join(',')); }
  r.setProperty('--grad', g.length >= 3
    ? `linear-gradient(135deg,${g[0]} 0%,${g[1]} 48%,${g[2]} 100%)`
    : `linear-gradient(135deg,${g[0]} 0%,${g[g.length-1]} 100%)`);
  const t1 = rgbDe(g[0]), t2 = rgbDe(g[g.length-1]);
  if (t1) r.setProperty('--tinte1', `rgba(${t1.join(',')},.13)`);
  if (t2) r.setProperty('--tinte2', `rgba(${t2.join(',')},.09)`);
  Object.entries(e.vars || {}).forEach(([k, v]) => r.setProperty('--' + k, v));
}

/* ── lo que vamos juntando ── */
const R = { fotos: [] };
/* Si llegó desde el DM de ManyChat, el link trae su id (?mc=...).
   Con eso el backend puede escribirle SIEMPRE, sin ventana de 24 h. */
R.manychatId = QS.get('mc') || null;
R.ref = (QS.get('ref') || '').replace(/^@/, '').trim().toLowerCase() || null;   // referida por
let i = 0;                 // pantalla actual
let idAplicante = null;    // lo devuelve el backend al registrar el @usuario
let PASOS = [];

/* ── definición del cuestionario, armada desde la config de la marca ──
   Cada paso: pregunta, ayuda, cómo se renderiza y cómo se valida. */
/* ── preguntas encadenadas y cupos (opt-in por marca; Valca) ──
   `dependeDe` + `opsPor`: las opciones salen de opsPor[respuesta anterior].
   `mostrarSi`: la pregunta aparece solo si la anterior vale eso.
   `cupos` + `cuposUsados` (vienen en la config): una opción con el cupo
   lleno se muestra apagada con "cupo completo". */
const opsDe = p => (p.dependeDe && p.opsPor) ? (p.opsPor[R[p.dependeDe]] || []) : (p.ops || []);
function cupoDe(tipo, k){
  const c = CFG.cupos; if (!c || !k) return null;
  const tanda = tipo === 'angulo' ? c.anguloTanda1 : c.tanda1;
  const total = tipo === 'angulo' ? c.angulo : c.kit;
  const v = (tanda && tanda[k] != null) ? tanda[k] : (total && total[k] != null ? total[k] : null);
  return v == null ? null : Number(v);
}
function usados(tipo, k){ const u = CFG.cuposUsados; return (u && u[tipo] && u[tipo][k] && u[tipo][k].aplicaron) || 0; }
/* ¿la opción `v` de la pregunta `p` tiene el cupo lleno? Se mira el cupo del
   ángulo (campo con tabla en cupos) o el del kit al que lleva (kitPorRespuesta). */
function cupoLleno(p, v){
  if (!CFG.cupos) return false;
  const c = cupoDe(p.campo, v);
  if (c != null && usados(p.campo, v) >= c) return true;
  const k = CFG.kitPorRespuesta;
  if (k && p.campo === k.campo){
    const kit = (k.mapa || {})[v], ck = cupoDe('kit', kit);
    if (kit && ck != null && usados('kit', kit) >= ck) return true;
  }
  return false;
}
const kitLleno = id => { const c = cupoDe('kit', id); return c != null && usados('kit', id) >= c; };
/* ¿este paso se muestra con lo que respondió hasta ahora? */
function visible(p){
  if (p.condicion && !p.condicion()) return false;
  if (p.tipo === 'opciones' && p.dependeDe){
    if (p.mostrarSi != null && R[p.dependeDe] !== p.mostrarSi) return false;
    if (p.opsPor && !opsDe(p).length) return false;
  }
  return true;
}
const siguiente = n => { let k = n + 1; while (k < PASOS.length - 1 && !visible(PASOS[k])) k++; return k; };
const anterior  = n => { let k = n - 1; while (k > 0 && !visible(PASOS[k])) k--; return k; };
/* el último paso visible antes del cierre es el que envía */
const esUltimo = n => siguiente(n) >= PASOS.length - 1;
const visibles = () => PASOS.filter((p, n) => n > 0 && n < PASOS.length - 1 && visible(p));

function armarPasos(){
  const F = CFG.formulario || {};
  const preguntas = (F.preguntas || []).map(p => ({ tipo:'opciones', campo:p.campo, q:p.q, a:p.a, ops:p.ops,
    dependeDe:p.dependeDe || null, opsPor:p.opsPor || null, mostrarSi:p.mostrarSi }));
  const antes = preguntas.filter((p, n) => (F.preguntas[n].pos || 'antes') === 'antes');
  const despues = preguntas.filter((p, n) => (F.preguntas[n].pos || 'antes') !== 'antes');
  // campos de texto propios de la marca (Valca: usuario de TikTok)
  const campos = (F.campos || []).map(c => ({ tipo:'texto', campo:c.campo, arroba:!!c.arroba, q:c.q, a:c.a || '',
    ph:c.ph || '', teclado:c.teclado || 'text', pos:c.pos || 'antes',
    valida: v => c.obligatorio ? (v.replace(/^@/, '').trim().length >= 2 || (c.error || 'Completá este dato')) : true }));
  const camposAntes = campos.filter(c => c.pos === 'antes'), camposDespues = campos.filter(c => c.pos !== 'antes');
  // elección a mano: los colores (Mi Luz) siempre; el 2º kit (kitPorRespuesta) solo si marcó dos videos
  const elegirN = CFG.elegir > 0 ? CFG.elegir : (CFG.kitPorRespuesta ? (CFG.kit2Elegir || 1) : 0);
  const eleccion = elegirN > 0 ? [{ tipo:'colores', q:CFG.eleccion.titulo, a:CFG.eleccion.ayuda, elegir: elegirN,
    condicion: CFG.kitPorRespuesta ? () => R.videos === 'dos' : null }] : [];

  PASOS = [
    { tipo:'portada' },

    { tipo:'texto', campo:'ig', arroba:true,
      q:'¿Cuál es tu Instagram?',
      a:'Lo primero, porque mientras completás el resto vamos mirando tu perfil.',
      ph:'tu.usuario', teclado:'text',
      valida: v => v.replace(/[^a-z0-9._]/gi,'').length >= 2 || 'Escribí tu usuario, sin el @' },

    ...camposAntes,
    ...antes,

    ...(F.fotos ? [{ tipo:'fotos', q:F.fotos.q, a:F.fotos.a, tip:F.fotos.tip, error:F.fotos.error }] : []),

    { tipo:'texto', campo:'nombre',
      q:'¿Cómo te llamás?',
      a:'Nombre y apellido, como figura en tu documento.',
      ph:'Nombre y apellido', teclado:'text', auto:'name',
      valida: v => v.trim().split(/\s+/).length >= 2 || 'Poné nombre y apellido' },

    { tipo:'texto', campo:'tel',
      q:'¿Tu WhatsApp?',
      a:'Es por donde te avisamos si quedás. Con código de área, sin el 15.',
      ph:'11 5555 5555', teclado:'tel',
      valida: v => v.replace(/\D/g,'').length >= 8 || 'Revisá el número' },

    { tipo:'texto', campo:'email',
      q:'¿Y tu mail?',
      a:'Por si el WhatsApp falla.',
      ph:'vos@mail.com', teclado:'email', auto:'email',
      valida: v => /^\S+@\S+\.\S+$/.test(v.trim()) || 'Revisá el mail' },

    { tipo:'select', campo:'provincia',
      q:'¿De qué provincia sos?',
      a:'Mandamos a todo el país.',
      ops: CFG.provincias || [] },

    ...camposDespues,
    ...despues,

    ...eleccion,

    { tipo:'cierre' }
  ];
}

const $ = s => document.querySelector(s);
const main = $('#main');

/* ── redimensionado en el navegador ────────────────────────────
   Sube 80 KB, no 4 MB: el celular hace el trabajo y el envío
   funciona con datos móviles flojos. */
function achicar(file, lado = 900, calidad = .82){
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onerror = () => mal(new Error('no se pudo leer'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => mal(new Error('no es una imagen'));
      img.onload = () => {
        const e = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * e);
        c.height = Math.round(img.height * e);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', calidad));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ── verificación en paralelo ──────────────────────────────────
   Se dispara apenas tenemos el @usuario. Para cuando termina el
   formulario, el perfil ya está medido. */
function registrarIg(ig){
  fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ accion:'registrar', marca:MARCA, ig, ref: R.ref })
  })
  .then(r => r.json())
  .then(d => { if (d && d.id) idAplicante = d.id; })
  .catch(() => {});   // si falla, se resuelve al enviar
}

/* ── render ────────────────────────────────────────────────────*/
function pintar(){
  const p = PASOS[i];
  p.ultimo = esUltimo(i);
  const vis = visibles();
  const total = vis.length + 1;
  const pos = i === 0 ? 0 : (i >= PASOS.length - 1 ? total : vis.indexOf(p) + 1);
  $('#barra').style.width = (pos / total * 100) + '%';
  $('#volver').hidden = i === 0 || i === PASOS.length - 1;
  $('#cuenta').textContent = (i > 0 && i < PASOS.length - 1) ? `${pos} de ${vis.length}` : '';

  main.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'paso on';
  d.innerHTML = plantilla(p);
  main.appendChild(d);
  conectar(p, d);
  const foco = d.querySelector('input[type=text],input[type=tel],input[type=email],select');
  if (foco) setTimeout(() => foco.focus({preventScroll:true}), 120);
}

const botonSig = p => `<button class="btn" data-sig>${p.ultimo ? 'Enviar mi aplicación' : 'Seguir'}</button>`;
const igUrl = () => CFG.cuentaIgUrl || `https://www.instagram.com/${CFG.cuentaIg}/`;

function plantilla(p){
  const F = CFG.formulario || {};
  if (p.tipo === 'portada') return `
    <div class="centro">
      ${F.chip ? `<span class="chip">${F.chip}</span>` : ''}
      <h1 class="hero-t">${F.titulo || 'Te mandamos el kit.<br>Vos hacés un video.'}</h1>
      <p class="ayuda">${F.intro || `${CFG.kit}, sin costo. A cambio, un reel en colaboración con ${CFG.nombre}.`}</p>
    </div>
    <div class="reqs">
      ${(F.requisitos || []).map(t => `
        <div class="req">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
          <span>${t}</span>
        </div>`).join('')}
    </div>
    <button class="btn" data-sig>Empezar · 2 minutos</button>`;

  if (p.tipo === 'texto') return `
    <h2 class="pregunta">${p.q}</h2>
    <p class="ayuda">${p.a}</p>
    ${p.arroba
      ? `<div class="conArroba"><span>@</span><input class="campo" id="c" type="text" inputmode="${p.teclado}" placeholder="${p.ph}" autocomplete="off" autocapitalize="none" spellcheck="false" value="${R[p.campo]||''}"></div>`
      : `<input class="campo" id="c" type="${p.teclado==='email'?'email':p.teclado==='tel'?'tel':'text'}" inputmode="${p.teclado}" placeholder="${p.ph}" autocomplete="${p.auto||'off'}" value="${R[p.campo]||''}">`}
    <p class="err" id="e"></p>
    ${botonSig(p)}`;

  if (p.tipo === 'opciones') return `
    <h2 class="pregunta">${p.q}</h2>
    <p class="ayuda">${p.a}</p>
    <div class="ops">
      ${opsDe(p).map(([v,t,s],n) => { const lleno = cupoLleno(p, v); return `
        <label class="op ${lleno ? 'off' : ''}">
          <input type="radio" name="o" value="${v}" ${R[p.campo]===v?'checked':''} ${lleno ? 'disabled' : ''}>
          <span class="tec">${String.fromCharCode(65+n)}</span>
          <span class="et">${t}${s?`<small>${s}</small>`:''}</span>
          ${lleno ? '<span class="cupo">cupo completo</span>' : ''}
        </label>`; }).join('')}
    </div>
    <p class="err" id="e"></p>
    ${p.ultimo ? botonSig(p) : ''}`;

  if (p.tipo === 'select') return `
    <h2 class="pregunta">${p.q}</h2>
    <p class="ayuda">${p.a}</p>
    <select class="campo" id="c">
      <option value="">Elegí…</option>
      ${p.ops.map(o => `<option ${R.provincia===o?'selected':''}>${o}</option>`).join('')}
    </select>
    <p class="err" id="e"></p>
    ${botonSig(p)}`;

  if (p.tipo === 'fotos') return `
    <h2 class="pregunta">${p.q}</h2>
    <p class="ayuda">${p.a}</p>
    <div class="fotos">
      ${[0,1].map(n => `
        <label class="slot ${R.fotos[n]?'lleno':''}" data-n="${n}">
          ${R.fotos[n] ? `<img src="${R.fotos[n]}" alt="Foto ${n+1}">` : `
            <span class="ph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h3l1.5-2h7L17 8.5h3a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5z"/><circle cx="12" cy="13.5" r="3.2"/></svg>
              <b>${n===0?'Foto 1':'Foto 2'}</b>
              <small>${n===0?'Obligatoria':'Opcional'}</small>
            </span>`}
          <input type="file" accept="image/*" capture="environment">
          <button type="button" class="quitar" aria-label="Quitar">✕</button>
        </label>`).join('')}
    </div>
    ${p.tip ? `<div class="tip">${p.tip}</div>` : ''}
    <p class="err" id="e"></p>
    ${botonSig(p)}`;

  // kits (kitPorRespuesta): lista con nombre y descripción, no paleta de colores
  if (p.tipo === 'colores' && CFG.kitPorRespuesta) return `
    <h2 class="pregunta">${p.q}</h2>
    <p class="ayuda">${p.a}</p>
    <div class="ops kits" id="tonos">
      ${CFG.opciones.map(t => { const lleno = kitLleno(t.id); return `
        <label class="op ${lleno ? 'off' : ''}">
          <input type="checkbox" value="${t.id}" ${(R.tonos||[]).includes(t.id)?'checked':''} ${lleno ? 'disabled' : ''}>
          <span class="tec sw" style="${t.hex ? `background:${t.hex};color:#fff` : ''}">${t.nom.slice(0,1)}</span>
          <span class="et">${t.nom}${t.desc?`<small>${t.desc}</small>`:''}</span>
          ${lleno ? '<span class="cupo">cupo completo</span>' : ''}
        </label>`; }).join('')}
    </div>
    <p class="err" id="e"></p>
    ${botonSig(p)}`;

  if (p.tipo === 'colores') return `
    <h2 class="pregunta">${p.q}</h2>
    <p class="ayuda">${p.a}</p>
    <div class="tonos" id="tonos">
      ${CFG.opciones.map(t => `
        <label class="tono">
          <input type="checkbox" value="${t.id}" ${(R.tonos||[]).includes(t.id)?'checked':''}>
          ${t.hex ? `<span class="sw" style="background:${t.hex}"></span>` : `<span class="sw txt">${t.nom.slice(0,2)}</span>`}
          <span class="nm">${t.nom}</span>
        </label>`).join('')}
    </div>
    <p class="err" id="e"></p>
    ${botonSig(p)}`;

  if (p.tipo === 'cierre') return `
    <div class="centro">
      <div class="sello">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
      </div>
      <h2 class="pregunta">¡Listo!</h2>
      <p class="ayuda">Recibimos tu aplicación y ya estamos mirando tu perfil.
      Si quedás, te escribimos por WhatsApp en los próximos días con el link para
      completar tus datos de envío.</p>
      <p class="ayuda" style="margin-bottom:0">Mientras tanto, seguinos en
      <a href="${igUrl()}" target="_blank" rel="noopener" style="color:var(--rosa);font-weight:700;text-decoration:none">@${CFG.cuentaIg}</a> — ahí publicamos las collabs de las chicas.</p>
    </div>`;

  if (p.tipo === 'error') return `
    <div class="centro">
      <h2 class="pregunta">No pudimos cargar la marca</h2>
      <p class="ayuda">Revisá tu conexión y volvé a abrir el link.</p>
    </div>`;

  return '';
}

/* ── comportamiento por tipo de pantalla ───────────────────────*/
function conectar(p, d){
  const sig = d.querySelector('[data-sig]');
  if (sig) sig.onclick = avanzar;

  if (p.tipo === 'texto' || p.tipo === 'select'){
    const c = d.querySelector('#c');
    c.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); avanzar(); } });
    if (p.tipo === 'select') c.addEventListener('change', () => { if (c.value) avanzar(); });
  }

  if (p.tipo === 'opciones'){
    // elegir avanza sola: es lo que hace que se sienta rápido
    d.querySelectorAll('input[name=o]').forEach(r =>
      r.addEventListener('change', () => {
        R[p.campo] = r.value;
        // si la respuesta cambia lo que viene después (pregunta encadenada, 2º kit),
        // se recalcula si este es el último paso: puede haber aparecido uno nuevo
        const ultimo = esUltimo(i);
        if (!ultimo){ setTimeout(avanzar, 220); return; }
        if (!p.ultimo){ p.ultimo = true; d.insertAdjacentHTML('beforeend', botonSig(p)); d.querySelector('[data-sig]').onclick = avanzar; }
      }));
  }

  if (p.tipo === 'fotos'){
    d.querySelectorAll('.slot').forEach(slot => {
      const n = +slot.dataset.n;
      slot.querySelector('input').addEventListener('change', async e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        try {
          R.fotos[n] = await achicar(f);
          pintar();
        } catch { mostrarError('No pudimos leer esa imagen. Probá con otra.'); }
      });
      slot.querySelector('.quitar').addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        R.fotos[n] = null; R.fotos = R.fotos.filter(Boolean); pintar();
      });
    });
  }

  if (p.tipo === 'colores'){
    const n = p.elegir || CFG.elegir;
    d.querySelector('#tonos').addEventListener('change', () => {
      const sel = [...d.querySelectorAll('#tonos input:checked')];
      d.querySelectorAll('#tonos .tono, #tonos .op').forEach(l => {
        const inp = l.querySelector('input');
        if (inp.disabled) return;   // cupo completo: queda apagada siempre
        l.classList.toggle('off', sel.length >= n && !inp.checked);
      });
      R.tonos = sel.map(c => c.value);
    });
  }
}

function mostrarError(t){
  const e = $('#e'); if (!e) return;
  e.textContent = t; e.classList.add('ver');
}

/* ── avanzar ───────────────────────────────────────────────────*/
async function avanzar(){
  const p = PASOS[i];
  const e = $('#e'); if (e) e.classList.remove('ver');

  if (p.tipo === 'texto'){
    const v = $('#c').value;
    const ok = p.valida ? p.valida(v) : true;
    if (ok !== true){ mostrarError(ok); return; }
    R[p.campo] = v.trim().replace(/^@/, '');
    if (p.campo === 'ig') registrarIg(R.ig);   // arranca la verificación
  }

  if (p.tipo === 'select'){
    const v = $('#c').value;
    if (!v){ mostrarError('Elegí una provincia'); return; }
    R[p.campo] = v;
  }

  if (p.tipo === 'opciones' && !R[p.campo]){ mostrarError('Elegí una opción'); return; }

  if (p.tipo === 'fotos' && !R.fotos.filter(Boolean).length){
    mostrarError(p.error || 'Necesitamos al menos una foto'); return;
  }

  if (p.tipo === 'colores' && (R.tonos || []).length !== (p.elegir || CFG.elegir)){
    mostrarError((CFG.eleccion && CFG.eleccion.error) || `Elegí exactamente ${p.elegir || CFG.elegir}`); return;
  }

  if (esUltimo(i)){ await enviar(); return; }

  i = siguiente(i); pintar();
}

$('#volver').onclick = () => { if (i > 0){ i = anterior(i); pintar(); } };

/* ── envío ─────────────────────────────────────────────────────*/
async function enviar(){
  const btn = document.querySelector('[data-sig]');
  btn.disabled = true; btn.textContent = 'Enviando…';
  // el 2º kit (kitPorRespuesta) viaja en `tonos` solo si marcó dos videos
  const tonos = (CFG.kitPorRespuesta && R.videos !== 'dos') ? [] : (R.tonos || []);
  const datos = { ig:R.ig, nombre:R.nombre, tel:R.tel, email:R.email, provincia:R.provincia, tonos };
  const F = CFG.formulario || {};
  (F.preguntas || []).forEach(p => { datos[p.campo] = visible(PASOS.find(x => x.campo === p.campo) || {}) ? R[p.campo] : ''; });
  (F.campos || []).forEach(c => { datos[c.campo] = R[c.campo] || ''; });
  try {
    const r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        accion:'aplicar', marca:MARCA, id:idAplicante, ref: R.ref,
        manychatId: R.manychatId,
        datos,
        fotos: R.fotos.filter(Boolean)
      })
    });
    if (!r.ok) throw new Error('http ' + r.status);
    i = PASOS.length - 1; pintar();
  } catch {
    btn.disabled = false; btn.textContent = 'Enviar mi aplicación';
    mostrarError('No pudimos enviarla. Revisá tu conexión y probá de nuevo.');
  }
}

(async function init(){
  try { CFG = await cargarConfig(); }
  catch {
    main.innerHTML = '';
    const d = document.createElement('div'); d.className = 'paso on'; d.innerHTML = plantilla({ tipo:'error' }); main.appendChild(d);
    return;
  }
  aplicarEstilo(CFG.estilo);
  document.title = `${CFG.nombre} · Sumate como creadora`;
  $('#marca-nombre').textContent = (CFG.estilo && CFG.estilo.logoTexto) || CFG.nombre;
  if (CFG.estilo && CFG.estilo.logoTamano === 'grande') document.body.classList.add('logo-grande');
  armarPasos();
  pintar();
})();
const APP_VERSION = '2026-09-26-a';
</script>
