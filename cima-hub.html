<html lang="es"><head>

<title>Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif}
:root{
  --bg:#FAF7F4;--card:#FFFFFF;--soft:#F6F2EE;--line:#EFE8E3;--line2:#E2D8D1;
  --txt:#26211E;--mut:#8A7E77;--mut2:#B5A79F;
  --ok:#3F8F6B;--warn:#B07B2E;--bad:#C1613C;
  --acc:#111111;--acc-light:#333333;
}
body{background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;
  padding:max(18px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:860px;margin:0 auto}

/* ── cabecera ── */
.hd{display:flex;align-items:center;gap:14px;margin:6px 2px 20px}
.hd img{height:34px;width:auto;display:block}
.hd .marca{font-size:19px;font-weight:700;letter-spacing:-.02em}
.hd .txt{min-width:0}
.hd .hola{font-size:12.5px;color:var(--mut);margin-top:2px}

/* ── tarjeta principal ── */
.hero{background:linear-gradient(135deg,var(--acc-light) 0%,var(--acc) 64%);color:#fff;border-radius:24px;
  padding:20px 22px;position:relative;overflow:hidden;margin-bottom:16px}
.hero .blob{position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);right:-80px;bottom:-95px}
.hero .ey{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.6}
.hero h1{font-size:21px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:7px 0 6px;position:relative}
.hero p{font-size:13px;line-height:1.5;opacity:.85;position:relative}

/* ── grilla de apps ── */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}
.app{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:18px;color:inherit;text-decoration:none;transition:border-color .18s,transform .18s}
.app:hover{border-color:var(--line2);transform:translateY(-1px)}
.app .ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.app .ico svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app .cuerpo{min-width:0;flex:1}
.app b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em}
.app p{font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:3px}
.app .datos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dato{font-size:11.5px;font-weight:600;background:var(--soft);color:var(--txt);border-radius:99px;padding:4px 10px;white-space:nowrap}
.dato.ok{background:rgba(63,143,107,.12);color:var(--ok)}
.dato.warn{background:rgba(176,123,46,.12);color:var(--warn)}
.dato.cargando{color:var(--mut2);font-weight:500}
.app .ir{font-size:12.5px;font-weight:600;color:var(--acc);margin-top:10px;display:inline-block}
.app.pronto{border-style:dashed;background:transparent;cursor:default}
.app.pronto:hover{transform:none;border-color:var(--line)}
.app.pronto .ico{background:transparent;border:1px dashed var(--line2)}
.app.pronto .ico svg{stroke:var(--mut2)}
.app.pronto b{color:var(--mut)}
.pill-pronto{font-size:11px;font-weight:600;background:var(--soft);color:var(--mut);border-radius:99px;padding:4px 10px;display:inline-block;margin-top:10px}

.foot{font-size:12px;color:var(--mut);line-height:1.55;margin-top:18px;padding:0 4px}
</style></head><body>

<div class="wrap">

  <div class="grid" id="grid"></div>

</div>

      {id:'stock', titulo:'Stock', icono:'caja',

      {id:'ads', titulo:'Publicidad con Claude', icono:'chat',

    pie:'Guardala en la pantalla de inicio del celular y te queda como una app más. Si algo no abre, escribinos.',
  },

const ICONOS = {
  gente:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  caja:'<path d="M21 8v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8"/><rect x="2" y="4" width="20" height="4" rx="1"/><path d="M10 12h4"/>',

  video:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/>',
};

const QS = new URLSearchParams(location.search);
const SLUG = (QS.get('brand')||QS.get('marca')||'miluz').toLowerCase().replace(/[^a-z0-9_-]/g,'');
const H = HUBS[SLUG] || HUBS.miluz;

document.title = H.nombre + ' — Inicio';
document.documentElement.style.setProperty('--acc', H.acento);
document.documentElement.style.setProperty('--acc-light', H.acentoClaro);

document.getElementById('hd').innerHTML = H.logo
  ? `<img src="${H.logo}" alt="${H.nombre}"><div class="txt"><div class="hola">${H.hola}</div></div>`
  : `<div class="txt"><div class="marca">${H.nombre}</div><div class="hola">${H.hola}</div></div>`;

document.getElementById('hero').innerHTML =
  `<span class="blob"></span><div class="ey">${H.nombre}</div><h1>${H.titulo}</h1><p>${H.bajada}</p>`;

document.getElementById('grid').innerHTML = H.apps.map(a=>{
  const ico = `<span class="ico"><svg viewBox="0 0 24 24">${ICONOS[a.icono]||''}</svg></span>`;
  const cuerpo = `<div class="cuerpo"><b>${a.titulo}</b><p>${a.bajada}</p>`;
  if(!a.url) return `<div class="app pronto">${ico}${cuerpo}<span class="pill-pronto">en camino</span></div></div>`;
  const datos = a.stats ? `<div class="datos" id="datos-${a.id}"><span class="dato cargando">buscando los números…</span></div>` : '';

}).join('');

document.getElementById('foot').textContent = H.pie || '';

// ── Números en vivo de los videos (los mismos que ve el panel) ──
const app = initializeApp({apiKey:"AIzaSyCTv4DiRCpbCpGYP6E86TPHlkPvaAZTN3g",authDomain:"cleargy-creators.firebaseapp.com",projectId:"cleargy-creators",storageBucket:"cleargy-creators.firebasestorage.app",messagingSenderId:"313543582398",appId:"1:313543582398:web:99fe78991adeea2e7cb4ef"});
let db; try{ db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true}); }catch(e){ db=getFirestore(app); }
const hoyART = () => new Date().toLocaleDateString('sv',{timeZone:'America/Argentina/Buenos_Aires'});

(async ()=>{
  const tarjeta = H.apps.find(a=>a.stats==='videos');
  const caja = tarjeta && document.getElementById('datos-'+tarjeta.id);
  if(!caja) return;
  try{
    await signInAnonymously(getAuth(app));
    const col = collection(db, H.marca+'_videos');
    const desdeMes = hoyART().slice(0,8)+'01';
    const [todos, rech, pend, mes] = await Promise.all([
      getCountFromServer(col),
      getCountFromServer(query(col, where('status','==','rejected'))),
      getCountFromServer(query(col, where('status','==','pending'))),
      getCountFromServer(query(col, where('date','>=',desdeMes))),
    ]);
    const total = todos.data().count - rech.data().count;   // los rechazados no cuentan, igual que en el panel
    const p = pend.data().count;
    caja.innerHTML =
      `<span class="dato">${total.toLocaleString('es-AR')} videos</span>`+
      `<span class="dato">${mes.data().count.toLocaleString('es-AR')} este mes</span>`+
      (p ? `<span class="dato warn">${p} para aprobar</span>` : `<span class="dato ok">al día</span>`);
  }catch(e){
    console.error(e);
    caja.innerHTML = '<span class="dato cargando">no se pudieron cargar los números</span>';
  }
})();

<!-- Auto-actualización: GitHub Pages cachea el HTML y los celulares lo retienen mucho más. -->
<script>
const APP_VERSION = '2026-09-25-a';
(function(){
  var CLAVE='cima_hub_ver';
  function chequear(){
    if(!navigator.onLine) return;
    fetch(location.pathname+'?cb='+Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok?r.text():null; })
      .then(function(t){
        if(!t) return;
        var m=t.match(/APP_VERSION\s*=\s*'([^']+)'/);
        if(!m || m[1]===APP_VERSION) return;
        if(sessionStorage.getItem(CLAVE)===m[1]) return;   // ya recargamos por esta versión
        sessionStorage.setItem(CLAVE, m[1]);
        location.reload();
      })
      .catch(function(){});
  }
  setTimeout(chequear, 1500);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) chequear(); });
})();
</script>
